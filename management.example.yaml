# Ordinary, non-secret Management Interface settings.
port: 9317
container: false
session_ttl_seconds: 43200
secrets_file: management.secrets.yaml
active_rule_set_file: active-rules.yaml
rule_source_hosts:
  - raw.githubusercontent.com
rule_download_timeout_seconds: 10
rule_download_max_bytes: 1048576
# Non-overlapping TrueNAS Host Paths or native filesystem trees.
media_roots:
  - /media/jav
# Derived hard-link Actor View. Must be on the same filesystem/ZFS dataset.
actor_view_root: /media/actors
