services:
  rust-jav:
    image: ghcr.io/hqwuzhaoyi/rust-jav:latest
    container_name: rust-jav
    restart: unless-stopped
    environment:
      RUST_JAV_UID: "568"
      RUST_JAV_GID: "568"
      RUST_JAV_CONFIG: /config/management.yaml
    ports:
      - "9317:9317"
    volumes:
      - /mnt/tank/apps/rust-jav/config:/config
      - /mnt/tank/apps/rust-jav/state:/state
      - /mnt/tank/apps/rust-jav/cache:/cache
      - /mnt/tank/media/jav:/media
      - /mnt/tank/media/actors:/actors
    networks:
      - jellyfin-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9317/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  jellyfin-net:
    name: jellyfin-net
    external: true
